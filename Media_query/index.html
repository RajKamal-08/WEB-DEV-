<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid-container {
            width:100vw;
            height:100vh;
            margin: 50px;
            gap:5px;
            display: grid;
            justify-content: center;
            grid-template-columns: repeat(3, 1fr);}
            .card{
             width: 200px;
                height: 200px;

                border: 1px solid #ccc;
            }
            .card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                border: 2px solid rgb(238, 15, 90);
                border-radius: 15px;
            }

            @media (max-width: 768px) {
                .grid-container {
                    width: 100%;
                    height: auto;
                    margin: 0;
                    padding: 16px;
                    box-sizing: border-box;
                    grid-template-columns: repeat(2, 1fr);
                    gap: 16px;
                }

                .card {
                    width: 100%;
                    height: auto;
                    aspect-ratio: 4 / 5;
                }
            }

            @media (max-width: 600px) {
                .grid-container {
                    grid-template-columns: 1fr;
                }

                .card {
                    max-width: 400px;
                    margin: 0 auto;
                }
            }
    </style>
</head>
<body>
    <div class="grid-container">
       <div class="card">
            <img src="assests/Photo(1).jpeg" alt="Photo1">
        </div>
        <div class="card">
            <img src="assests/Photo(2).jpeg" alt="Photo2">
        </div>
        <div class="card">
            <img src="assests/photo(3).jpeg" alt="Photo3">
        </div>
        <div class="card">
            <img src="assests/Photo(4).jpeg" alt="Photo4">
        </div>
        <div class="card">
            <img src="assests/Photo(6).jpeg" alt="Photo5">
        </div>
        <div class="card">
            <img src="assests/Photo(7).jpeg" alt="photo6">
        </div>
        <div class="card">
            <img src="assests/photo(8).jpeg" alt="Photo7">
        </div>
        <div class="card">
            <img src="assests/Photo(9).jpeg" alt="Photo8">
        </div>
        <div class="card">
            <img src="assests/Photo(5).jpeg" alt="Photo5">
        </div>

    </div>
</body>
</html>
