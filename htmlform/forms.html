    <h1>Student Registration Form</h1>
    <p>please fill the details below</p>
    <fieldset>
        <legend>Personal Information</legend>
    
    <form>
        <label for="Full Name">Full Name:</label>
        <input type="text" id="Full Name">
        <br>
        <br>
        <label for="Mobile Number">Mobile Number:</label>
        <input type="text" id="Mobile Number">
         <br>
        <br>
        <label for="Email">Email:</label>
        <input type="text" id="Email">
         <br>
        <br>
        <label for="Password">Password:</label>
        <input type="password" id="Password">
         <br>
        <br>
        <label for="Age">Age:</label>
        <input type="Age" id="Age">
        <br>
        <br>
        <label for="Gender">Gender:</label>
       
         <input type="radio" id="Gender">
         <label for="Male">Male:</label>
         <input type="radio" id="Gender">
         <label for="Female">Female:</label>
         </fieldset>
         

          <br>
        <br>
        <label for="Date of Birth">Date of Birth:</label>
        <input type="date" id="Date of Birth">
        <br>
        <br>
        <fieldset>
            <legend>Aditional Information</legend>
            <label for="Interests">Interests:</label>
            <input type="checkbox" id="Coding">
         <label for="Coding">Coding</label>
         <input type="checkbox" id="Coding">
        <label for="Sports">Sports</label>
         <input type="checkbox" id="Sports">
         <label for="Music">Music</label>
         
         <br>
         <br>

          <label for="Select Course">Select Course:</label>
         <select id="Select Course">
            <option value="BCA">BCA</option>
         </select>
         <br>
         <br>
        </fieldset>
        <br>
        <br>
        <label for="Upload Resume">Upload Resume:</label>
        <input type="file" id="Upload Resume">
         <br>
         <br>
         <label for="Why do you want to join this course?">Why do you want to join this course?</label>
         <br>
         <br>
        <textarea  id="Why do you want to join this course?"></textarea>
        <br>
        <br>
        <button type="Register">Register</button>
        <button type="Reset">Reset</button>
