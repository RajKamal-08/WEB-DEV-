<!DOCTYPE html>
<html>
<head>
<style> 
div {
  width: 100px;
  height: 100px;
  background-color: plum;
  position: relative;
  animation-name: myAnimation;
  animation-iteration-count: infinite;
  animation-direction: alternate;

  animation-duration: 4s;
}

@keyframes myAnimation {
  0%   {background-color:plum; left:0px; top:0px;}
  25%  {background-color:firebrick; left:200px; top:0px;}
  50%  {background-color:slateblue; left:200px; top:200px;}
  75%  {background-color:palegreen; left:0px; top:200px;}
  100% {background-color:gold; left:0px; top:0px;}
}
</style>
</head>
<body style="background-color:#FFEDE6;">
    

<h1>CSS Animation</h1>

<div></div>

<!-- <p><b>Note:</b> When an animation is finished, it goes back to its original style.</p> -->

</body>
</html>
